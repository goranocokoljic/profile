<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goran Ocokoljić — Lead Web Engineer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header container">
    <a class="monogram" href="#top" aria-label="Goran Ocokoljić home">GO<span>.</span></a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="#work" data-copy="nav.work"></a><a href="#build" data-copy="nav.build"></a><a href="#about" data-copy="nav.about"></a><a href="#contact" data-copy="nav.contact"></a>
    </nav>
    <a class="header-cv" href="/goran-ocokoljic-cv.pdf" data-copy="nav.cv"></a>
  </header>

  <main id="top">
    <section class="hero container">
      <div class="hero-copy">
        <p class="eyebrow" data-copy="hero.eyebrow"></p>
        <h1><span data-copy="hero.headlineStart"></span><span class="headline-emphasis" data-copy="hero.headlineEmphasis"></span></h1>
        <p class="hero-support" data-copy="hero.supporting"></p>
        <div class="hero-actions"><a class="button button-primary" href="#work"><span data-copy="hero.primary"></span><span aria-hidden="true">→</span></a><a class="button button-secondary" href="#build" data-copy="hero.secondary"></a><a class="text-link" href="/goran-ocokoljic-cv.pdf" data-copy="hero.cv"></a></div>
        <p class="build-note"><span class="build-note-rule"></span><span data-copy="hero.buildNote"></span></p>
      </div>
      <figure class="hero-photo-wrap"><img src="assets/goran-hero.jpg" alt="Goran Ocokoljić" class="hero-photo" /></figure>
    </section>

    

    <section class="role-fit container" id="work"><div class="section-kicker"><span></span></div><h2 data-copy="roleFit.title"></h2><p class="role-intro" data-copy="roleFit.intro"></p><div class="role-grid" id="roleGrid"></div></section>
    <section class="selected-work container" aria-label="Selected work"><p class="eyebrow" data-copy="selected.label"></p><div class="selected-grid" id="selectedGrid"></div></section>

    <section class="platform-section" id="platform">
      <div class="container platform-grid">
        <div class="platform-copy"><p class="eyebrow" data-copy="platform.eyebrow"></p><h2 data-copy="platform.title"></h2><p data-copy="platform.intro1"></p><p data-copy="platform.intro2"></p><div class="platform-role" id="platformRole"></div></div>
        <div class="platform-visual"><div class="diagram-label" data-copy="platform.diagram.label"></div><div class="architecture-diagram"><div class="portal-row" id="portalRow"></div><div class="connector connector-down"></div><div class="platform-core"><strong data-copy="platform.diagram.coreTitle"></strong><small data-copy="platform.diagram.coreDetail"></small></div><div class="connector connector-down"></div><div class="foundation-row" id="foundationRow"></div></div><div class="shift-copy"><h3 data-copy="platform.shiftTitle"></h3><p data-copy="platform.shiftBody"></p></div><div class="metrics" id="metrics"></div></div>
      </div>
      <div class="container platform-lower"><div class="ownership-block"><h3 data-copy="platform.ownershipTitle"></h3><p data-copy="platform.ownershipBody"></p></div><blockquote data-copy="platform.closing"></blockquote></div>
    </section>

    <section class="ai-section" id="ai">
      <div class="container ai-intro"><div><p class="eyebrow" data-copy="ai.eyebrow"></p><h2 data-copy="ai.title"></h2></div><div class="ai-intro-copy"><p data-copy="ai.intro1"></p><p data-copy="ai.intro2"></p></div></div>
      <div class="container ai-dev-grid">
        <div class="ai-dev-copy"><p class="mini-label" data-copy="ai.devLabel"></p><h3 data-copy="ai.devTitle"></h3><p data-copy="ai.devBody"></p></div>
        <div class="flow-stack" id="aiDevFlow"></div>
      </div>
      <div class="container ai-two-col">
        <article class="ai-card context-card"><p class="mini-label" data-copy="ai.contextLabel"></p><h3 data-copy="ai.contextTitle"></h3><p data-copy="ai.contextBody"></p><div class="lens-row"><span>prepare_change</span><span>edit</span><span>verify_change</span><span>compare_change_impact</span></div><a class="text-link" href="https://github.com/goranocokoljic/pure-context" target="_blank" rel="noopener" data-copy="ai.contextLink"></a></article>
        <article class="ai-card review-card"><p class="mini-label" data-copy="ai.reviewLabel"></p><h3 data-copy="ai.reviewTitle"></h3><p data-copy="ai.reviewBody"></p><div class="lens-row" id="lensRow"></div><div class="finished-statement"><strong data-copy="ai.finished"></strong><p data-copy="ai.finishedBody"></p></div></article>
      </div>
      <div class="container limits-row"><div class="limits-copy"><p class="mini-label" data-copy="ai.limitsLabel"></p><h3 data-copy="ai.limitsTitle"></h3><p data-copy="ai.limitsBody"></p></div><div class="control-flow" id="controlFlow"></div></div>
      <div class="qa-zone"><div class="container qa-grid"><div class="qa-copy"><p class="mini-label" data-copy="ai.qaLabel"></p><h3 data-copy="ai.qaTitle"></h3><p data-copy="ai.qaBody"></p></div><div><div class="qa-flow" id="qaFlow"></div><div class="qa-principles" id="qaPrinciples"></div></div></div>
        <div class="container findings-panel"><div><p class="mini-label" data-copy="ai.findingsLabel"></p><h3 data-copy="ai.findingsTitle"></h3></div><ul id="findingsList"></ul></div>
      </div>
      <div class="container ai-close"><div><h3 data-copy="ai.ownershipTitle"></h3><p data-copy="ai.ownershipBody"></p></div><blockquote data-copy="ai.closing"></blockquote></div>
    </section>

    <section class="vismedic-section" id="vismedic">
      <div class="container vismedic-opening"><div><p class="eyebrow" data-copy="vismedic.eyebrow"></p><h2 data-copy="vismedic.title"></h2><p class="vismedic-intro" data-copy="vismedic.intro"></p></div><div class="vismedic-meta" id="vismedicMeta"></div></div>
      <div class="container archive-section"><p class="mini-label" data-copy="vismedic.archiveLabel"></p><div class="archive-grid"><figure class="archive-main"><img src="assets/vismedic/doctor-consultation.png" alt="VisMedic doctor consultation workspace"/><figcaption>Doctor consultation workspace</figcaption></figure><figure><img src="assets/vismedic/patient-booking.png" alt="VisMedic patient booking and medical documentation screen"/><figcaption>Patient booking and records</figcaption></figure><figure><img src="assets/vismedic/doctor-calendar.png" alt="VisMedic doctor calendar"/><figcaption>Doctor calendar</figcaption></figure></div></div>
      
      
      <div class="container adoption-grid"><div class="adoption-copy"><h3 data-copy="vismedic.realTitle"></h3><p data-copy="vismedic.realBody"></p><p class="privacy-line" data-copy="vismedic.hipaa"></p><div class="recognition-list" id="recognitionList"></div></div><figure class="ring-photo"><img src="assets/vismedic/ring-award.png" alt="Goran holding the Get in the Ring Serbia award in 2016"/><figcaption>Get in the Ring Serbia · 2016</figcaption></figure></div>
      <div class="container"><blockquote class="vismedic-quote" data-copy="vismedic.closing"></blockquote></div>
    </section>

    

    <section class="build-story" id="build"><div class="container"><p class="eyebrow" data-copy="buildStory.eyebrow"></p><div class="build-story-top"><div><h2 data-copy="buildStory.title"></h2><p data-copy="buildStory.intro"></p></div><div class="intent-triad" id="intentTriad"></div></div><div class="build-pipeline" id="buildPipeline"></div><div class="build-story-mid"><div><p data-copy="buildStory.body"></p></div><article class="task-trail"><span class="mono-label">BUILD RECORD</span><h3 data-copy="buildStory.trailTitle"></h3><p data-copy="buildStory.trailNote"></p><div class="glance-metrics" id="glanceMetrics"></div><a class="text-link" href="/build" data-copy="buildStory.cta"></a></article></div></div></section>

    

    <section class="background-section" id="about"><div class="container background-grid"><div class="background-copy"><p class="eyebrow" data-copy="background.eyebrow"></p><h2 data-copy="background.title"></h2><div id="backgroundParagraphs"></div><p class="cv-line"><span data-copy="background.cv"></span> <a href="/goran-ocokoljic-cv.pdf">Download CV →</a></p></div></div></section>

    <section class="contact-section" id="contact"><div class="container contact-grid"><div><h2 data-copy="contact.title"></h2><p data-copy="contact.supporting"></p></div><div class="contact-links"><a href="/goran-ocokoljic-cv.pdf" data-copy="contact.cv"></a><a href="https://github.com/goranocokoljic" target="_blank" rel="noopener" data-copy="contact.github"></a><a href="https://github.com/goranocokoljic/pure-context" target="_blank" rel="noopener" data-copy="contact.purecontext"></a><a href="https://www.linkedin.com/in/goranocokoljic/" target="_blank" rel="noopener" data-copy="contact.linkedin"></a><a class="email-link" href="mailto:goran.ocokoljic@gmail.com" data-copy="contact.email"></a><span data-copy="contact.location"></span></div></div><div class="container footer-row"><a class="monogram" href="#top">GO<span>.</span></a><span data-copy="contact.footer"></span></div></section>
  </main>

  <script src="content.js"></script>
  <script>
    const get = p => p.split('.').reduce((o,k)=>o[k],window.siteCopy);
    document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=get(el.dataset.copy));
    const fill=(id,items,fn)=>{const el=document.getElementById(id);items.forEach((x,i)=>el.appendChild(fn(x,i)));};
    fill('roleGrid',siteCopy.roleFit.items,(x,i)=>{let a=document.createElement('article');a.className='role-item';a.innerHTML=`<span class="role-index">0${i+1}</span><div><h3>${x.title}</h3><p>${x.body}</p></div>`;return a});
    fill('selectedGrid',siteCopy.selected.items,x=>{let a=document.createElement('a');a.className='selected-link';a.href=x.href;a.innerHTML=`<span class="selected-number">${x.number}</span><strong>${x.title}</strong><span>↘</span>`;return a});
    fill('platformRole',siteCopy.platform.roleLabels,x=>{let s=document.createElement('span');s.textContent=x;return s});
    fill('portalRow',siteCopy.platform.diagram.portals,x=>{let s=document.createElement('span');s.textContent=x;return s});
    fill('foundationRow',siteCopy.platform.diagram.foundation,x=>{let s=document.createElement('span');s.textContent=x;return s});
    fill('metrics',siteCopy.platform.metrics,x=>{let d=document.createElement('div');d.className='metric';d.innerHTML=`<strong>${x.value}</strong><span>${x.label}</span>${x.note?`<small>${x.note}</small>`:''}`;return d});
    fill('aiDevFlow',siteCopy.ai.devFlow,(x,i)=>{let d=document.createElement('div');d.className='flow-step';d.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><strong>${x}</strong>`;return d});
    fill('lensRow',siteCopy.ai.lenses,x=>{let s=document.createElement('span');s.textContent=x;return s});
    fill('controlFlow',siteCopy.ai.controls,x=>{let d=document.createElement('div');d.className='control-step';d.innerHTML=`<strong>${x[0]}</strong><span>${x[1]}</span>`;return d});
    fill('qaFlow',siteCopy.ai.qaFlow,(x,i)=>{let d=document.createElement('div');d.className='qa-step';d.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><strong>${x}</strong>`;return d});
    fill('qaPrinciples',siteCopy.ai.qaPrinciples,x=>{let a=document.createElement('article');a.innerHTML=`<h4>${x.title}</h4><p>${x.body}</p>`;return a});
    fill('findingsList',siteCopy.ai.findings,x=>{let li=document.createElement('li');li.textContent=x;return li});
    fill('vismedicMeta',siteCopy.vismedic.meta,x=>{let d=document.createElement('div');d.innerHTML=`<span>${x[0]}</span><strong>${x[1]}</strong>`;return d});
    fill('recognitionList',siteCopy.vismedic.recognition,x=>{let d=document.createElement('div');d.innerHTML=`<strong>${x[0]}</strong><span>${x[1]}</span>`;return d});
    fill('intentTriad',siteCopy.buildStory.triad,x=>{let s=document.createElement('span');s.textContent=x;return s});
    fill('buildPipeline',siteCopy.buildStory.flow,(x,i)=>{let d=document.createElement('div');d.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><strong>${x}</strong>`;return d});
    fill('glanceMetrics',siteCopy.buildStory.metrics,x=>{let d=document.createElement('div');d.innerHTML=`<span>${x[0]}</span><strong>${x[1]}</strong>`;return d});
    fill('backgroundParagraphs',siteCopy.background.paragraphs,x=>{let p=document.createElement('p');p.textContent=x;return p});
  </script>
</body>
</html>
