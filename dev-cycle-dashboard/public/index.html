<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev-cycle dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='8' width='3' height='7' rx='1' fill='%232a78d6'/%3E%3Crect x='6' y='4' width='3' height='11' rx='1' fill='%232a78d6'/%3E%3Crect x='11' y='1' width='3' height='14' rx='1' fill='%232a78d6'/%3E%3C/svg%3E">
<style>
:root {
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #1baf7a;
  --series-3: #eda100;
  --series-4: #008300;
  --series-5: #4a3aa7;
  --series-6: #e34948;
  --series-7: #e87ba4;
  --deemph: #c3c2b7;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-critical: #d03b3b;
  --sev-critical: #0d366b;
  --sev-high: #1c5cab;
  --sev-medium: #2a78d6;
  --sev-low: #5598e7;
  --sev-style: #86b6ef;
  --accent-wash: rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #199e70;
    --series-3: #c98500;
    --series-4: #008300;
    --series-5: #9085e9;
    --series-6: #e66767;
    --series-7: #d55181;
    --deemph: #52514e;
    --sev-critical: #184f95;
    --sev-high: #2a78d6;
    --sev-medium: #5598e7;
    --sev-low: #86b6ef;
    --sev-style: #b7d3f6;
    --accent-wash: rgba(57,135,229,0.12);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--series-1); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 64px; }
header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
header h1 { font-size: 19px; font-weight: 650; margin: 0; }
.asof { color: var(--text-muted); font-size: 12.5px; margin-left: auto; }
button {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 7px; padding: 5px 12px; cursor: pointer;
}
button:hover { background: var(--accent-wash); }
.filters { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: none; background: transparent; border-radius: 6px; padding: 4px 12px; color: var(--text-secondary); }
.seg button.on { background: var(--accent-wash); color: var(--text-primary); font-weight: 600; }
.seg button:hover { background: var(--accent-wash); }
.filter-label { color: var(--text-muted); font-size: 12.5px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--text-secondary); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 620; margin-top: 2px; }
.tile .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.card-head h2 { font-size: 14px; font-weight: 650; margin: 0; }
.card-head .spacer { flex: 1; }
.tbl-toggle { font-size: 12px; padding: 2px 9px; color: var(--text-muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 2px 0 8px; font-size: 12.5px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 16px; height: 2.5px; border-radius: 2px; display: inline-block; }
.footnote { color: var(--text-muted); font-size: 11.5px; margin-top: 8px; }
.chart-body svg { display: block; }
.chart-body { overflow-x: auto; }

table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th {
  text-align: left; color: var(--text-muted); font-weight: 550; font-size: 12px;
  border-bottom: 1px solid var(--grid); padding: 6px 10px 6px 0; white-space: nowrap;
}
table.data td { border-bottom: 1px solid var(--grid); padding: 6px 10px 6px 0; vertical-align: top; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr:last-child td { border-bottom: none; }
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable:hover { color: var(--text-primary); }
tr.expandable { cursor: pointer; }
tr.expandable:hover td { background: var(--accent-wash); }
tr.detail-row > td { background: color-mix(in srgb, var(--surface-1) 60%, var(--page)); padding: 14px 16px; }
.detail h3 { font-size: 12.5px; font-weight: 650; margin: 12px 0 6px; color: var(--text-secondary); }
.detail h3:first-child { margin-top: 0; }
.chev { display: inline-block; color: var(--text-muted); width: 14px; transition: transform .12s; }
.chev.open { transform: rotate(90deg); }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status .dot { font-size: 12px; }
.mini-bar { background: var(--series-1); height: 8px; border-radius: 0 3px 3px 0; display: inline-block; vertical-align: middle; }
.sevtag { color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

#tooltip {
  position: fixed; z-index: 10; pointer-events: none; display: none;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18); padding: 8px 11px; font-size: 12.5px; max-width: 300px;
}
#tooltip .tt-title { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
#tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
#tooltip .tt-key { width: 14px; height: 2.5px; border-radius: 2px; flex: none; }
#tooltip .tt-val { font-weight: 650; font-variant-numeric: tabular-nums; }
#tooltip .tt-lab { color: var(--text-secondary); }

main.loading { opacity: 0.55; transition: opacity .15s; }
.empty { color: var(--text-muted); padding: 18px 0; }
.section-title { font-size: 15px; font-weight: 650; margin: 22px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dev-cycle dashboard</h1>
    <span class="asof" id="asof"></span>
    <button id="refresh">Refresh</button>
  </header>

  <div class="filters">
    <span class="filter-label">Period</span>
    <span class="seg" id="seg-period"></span>
    <span class="filter-label">Outcome</span>
    <span class="seg" id="seg-outcome"></span>
  </div>

  <main id="main">
    <section class="kpis" id="kpis"></section>
    <section class="grid">
      <div class="card" id="card-cost"></div>
      <div class="card" id="card-trend"></div>
      <div class="card" id="card-phases"></div>
      <div class="card" id="card-sev"></div>
    </section>
    <div class="section-title">Runs</div>
    <div class="card" id="card-runs"></div>
    <section class="grid" style="margin-top:14px">
      <div class="card" id="card-epics"></div>
      <div class="card" id="card-lessons"></div>
    </section>
  </main>
</div>
<div id="tooltip"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ state */
const state = {
  data: null,
  period: 'all',            // all | 90 | 30 | 7
  outcome: 'all',           // all | ok | problems
  sort: { key: 'ts', dir: -1 },
  expanded: new Set(),
  tableMode: new Set(),     // chart card ids currently showing their table twin
};
const REPO_ISSUES = 'https://github.com/goranocokoljic/toprope/issues/';
const PHASE_ORDER = ['read', 'branch', 'implement', 'build+test', 'pr', 'review', 'merge'];
const PHASE_VAR = {
  'read': '--series-1', 'branch': '--series-2', 'implement': '--series-3',
  'build+test': '--series-4', 'pr': '--series-5', 'review': '--series-6', 'merge': '--series-7',
};
const SEVERITIES = ['critical', 'high', 'medium', 'low', 'style'];
const SEV_VAR = {
  critical: '--sev-critical', high: '--sev-high', medium: '--sev-medium',
  low: '--sev-low', style: '--sev-style',
};

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ------------------------------------------------------------- formatters */
const fmtInt = (n) => n.toLocaleString('en-US');
function fmtUsd(v) {
  if (v == null || isNaN(v)) return '—';
  if (v >= 1000) return '$' + Math.round(v).toLocaleString('en-US');
  if (v >= 100) return '$' + v.toFixed(0);
  return '$' + v.toFixed(2);
}
function fmtDur(sec) {
  if (sec == null || isNaN(sec)) return '—';
  if (sec < 60) return Math.round(sec) + 's';
  const m = sec / 60;
  if (m < 60) return Math.round(m) + 'm';
  const h = Math.floor(sec / 3600);
  const rm = Math.round((sec - h * 3600) / 60);
  return h + 'h ' + (rm > 0 ? rm + 'm' : '');
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDay(d) { return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function fmtDateTime(d) {
  return fmtDay(d) + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtCtx(tokens) {
  if (tokens == null) return '—';
  return Math.round(tokens / 1000) + 'k';
}
function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function dayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ------------------------------------------------------------ dom helpers */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}
const SVG_NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...children) {
  const node = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c.nodeType ? c : document.createTextNode(String(c)));
  return node;
}
function roundedTopRect(x, y, w, hgt, r) {
  r = Math.max(0, Math.min(r, w / 2, hgt));
  return `M${x},${y + hgt} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + hgt} Z`;
}
function roundedRightRect(x, y, w, hgt, r) {
  r = Math.max(0, Math.min(r, hgt / 2, w));
  return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + hgt - r} Q${x + w},${y + hgt} ${x + w - r},${y + hgt} L${x},${y + hgt} Z`;
}
function inkFor(hex) {
  // pick white or dark ink by fill luminance, for labels set inside a colored fill
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const lum = 0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255);
  return lum > 150 ? '#0b0b0b' : '#ffffff';
}
function niceTicks(max, count) {
  if (max <= 0) return [0, 1];
  const rough = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  let step = mag;
  for (const m of [1, 2, 5, 10]) { if (rough <= m * mag) { step = m * mag; break; } }
  const ticks = [];
  for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}

/* ---------------------------------------------------------------- tooltip */
const tooltip = document.getElementById('tooltip');
function tipShow(evt, title, rows) {
  tooltip.textContent = '';
  if (title) tooltip.append(h('div', { class: 'tt-title' }, title));
  for (const r of rows) {
    const row = h('div', { class: 'tt-row' });
    if (r.color) { const key = h('span', { class: 'tt-key' }); key.style.background = r.color; row.append(key); }
    row.append(h('span', { class: 'tt-val' }, r.value));
    if (r.label) row.append(h('span', { class: 'tt-lab' }, r.label));
    tooltip.append(row);
  }
  tooltip.style.display = 'block';
  tipMove(evt);
}
function tipMove(evt) {
  const pad = 14;
  const rect = tooltip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function tipHide() { tooltip.style.display = 'none'; }

/* ------------------------------------------------------------- filtering */
function filteredTasks() {
  const tasks = state.data.tasks.map(t => ({ ...t, date: new Date(t.ts) }));
  let cutoff = null;
  if (state.period !== 'all') {
    cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - Number(state.period));
  }
  return tasks.filter(t => {
    if (cutoff && t.date < cutoff) return false;
    if (state.outcome === 'ok' && t.outcome !== 'ok') return false;
    if (state.outcome === 'problems' && t.outcome === 'ok') return false;
    return true;
  }).sort((a, b) => a.date - b.date);
}
function filteredEpics() {
  const epics = state.data.epics.map(e => ({ ...e, date: new Date(e.ts) }));
  let cutoff = null;
  if (state.period !== 'all') {
    cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - Number(state.period));
  }
  return epics.filter(e => !cutoff || e.date >= cutoff).sort((a, b) => a.date - b.date);
}

/* --------------------------------------------------------- generic  card */
function renderCard(cardEl, cfg) {
  cardEl.textContent = '';
  const showTable = state.tableMode.has(cfg.id);
  const head = h('div', { class: 'card-head' },
    h('h2', null, cfg.title),
    h('span', { class: 'spacer' }),
    h('button', {
      class: 'tbl-toggle',
      onclick: () => { showTable ? state.tableMode.delete(cfg.id) : state.tableMode.add(cfg.id); renderAll(); },
    }, showTable ? 'chart' : 'table'),
  );
  cardEl.append(head);
  if (cfg.legend && cfg.legend.length > 1 && !showTable) {
    const lg = h('div', { class: 'legend' });
    for (const item of cfg.legend) {
      const sw = h('span', { class: item.type === 'line' ? 'ln' : 'sw' });
      sw.style.background = item.color;
      lg.append(h('span', { class: 'item' }, sw, item.label));
    }
    cardEl.append(lg);
  }
  const body = h('div', { class: 'chart-body' });
  cardEl.append(body);
  if (showTable) body.append(dataTable(cfg.table.cols, cfg.table.rows));
  else cfg.renderChart(body);
  if (cfg.note) cardEl.append(h('div', { class: 'footnote' }, cfg.note));
}
function dataTable(cols, rows) {
  const thead = h('thead', null, h('tr', null, cols.map(c => h('th', { class: c.num ? 'num' : '' }, c.label))));
  const tbody = h('tbody', null, rows.map(r =>
    h('tr', null, r.map((cell, i) => h('td', { class: cols[i].num ? 'num' : '' }, cell)))
  ));
  if (!rows.length) return h('div', { class: 'empty' }, 'No data in this range.');
  return h('table', { class: 'data' }, thead, tbody);
}

/* ------------------------------------------------- daily grouping helper */
function groupByDay(tasks) {
  const map = new Map();
  for (const t of tasks) {
    const k = dayKey(t.date);
    if (!map.has(k)) map.set(k, { key: k, date: new Date(t.date.getFullYear(), t.date.getMonth(), t.date.getDate()), tasks: [] });
    map.get(k).tasks.push(t);
  }
  return map;
}
function dayRange(tasks) {
  if (!tasks.length) return [];
  const first = tasks[0].date, last = tasks[tasks.length - 1].date;
  const days = [];
  const d = new Date(first.getFullYear(), first.getMonth(), first.getDate());
  const end = new Date(last.getFullYear(), last.getMonth(), last.getDate());
  while (d <= end) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return days;
}

/* ------------------------------------------------------ chart: cost / day */
function renderCostCard(tasks) {
  const byDay = groupByDay(tasks);
  const days = dayRange(tasks).map(date => {
    const g = byDay.get(dayKey(date));
    return {
      date,
      value: g ? g.tasks.reduce((a, t) => a + (t.billed_cost_usd || 0), 0) : 0,
      runs: g ? g.tasks.length : 0,
      issues: g ? g.tasks.map(t => '#' + t.issue) : [],
    };
  });
  renderCard(document.getElementById('card-cost'), {
    id: 'cost', title: 'Billed cost per day',
    note: 'Totals use billed_cost_usd (authoritative). Hover a column for the day’s runs.',
    table: {
      cols: [{ label: 'Date' }, { label: 'Runs', num: true }, { label: 'Issues' }, { label: 'Billed cost', num: true }],
      rows: days.filter(d => d.runs > 0).map(d => [fmtDay(d.date), String(d.runs), d.issues.join(', '), fmtUsd(d.value)]),
    },
    renderChart: (el) => columnChart(el, days, {
      color: cssVar('--series-1'),
      fmtValue: fmtUsd,
      tipRows: (d) => [
        { color: cssVar('--series-1'), value: fmtUsd(d.value), label: 'billed' },
        { value: String(d.runs), label: d.runs === 1 ? 'run' : 'runs' },
        ...(d.issues.length ? [{ value: '', label: d.issues.join(', ') }] : []),
      ],
    }),
  });
}

function columnChart(container, days, opts) {
  if (!days.length) { container.append(h('div', { class: 'empty' }, 'No data in this range.')); return; }
  const W = Math.max(320, container.clientWidth || 560);
  const M = { t: 14, r: 8, b: 26, l: 44 };
  const plotW = W - M.l - M.r, plotH = 190;
  const HGT = plotH + M.t + M.b;
  const maxV = Math.max(...days.map(d => d.value), 0.001);
  const ticks = niceTicks(maxV, 4);
  const yMax = ticks[ticks.length - 1];
  const y = v => M.t + plotH - (v / yMax) * plotH;
  const band = plotW / days.length;
  const barW = Math.min(24, Math.max(2, band - 3));
  const svg = s('svg', { width: W, height: HGT, viewBox: `0 0 ${W} ${HGT}`, role: 'img' });
  for (const tv of ticks) {
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(tv), y2: y(tv), stroke: cssVar('--grid'), 'stroke-width': 1 }));
    svg.append(s('text', { x: M.l - 7, y: y(tv) + 4, 'text-anchor': 'end', 'font-size': 11, fill: cssVar('--text-muted'), style: 'font-variant-numeric: tabular-nums' }, opts.fmtValue(tv)));
  }
  svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(0), y2: y(0), stroke: cssVar('--baseline'), 'stroke-width': 1 }));
  const every = Math.max(1, Math.ceil(days.length / 8));
  days.forEach((d, i) => {
    const cx = M.l + band * i + band / 2;
    if (i % every === 0) svg.append(s('text', { x: cx, y: HGT - 8, 'text-anchor': 'middle', 'font-size': 11, fill: cssVar('--text-muted') }, fmtDay(d.date)));
    if (d.value > 0) {
      const bh = (d.value / yMax) * plotH;
      svg.append(s('path', { d: roundedTopRect(cx - barW / 2, y(d.value), barW, bh, 4), fill: opts.color, 'data-col': i }));
    }
    const hit = s('rect', {
      x: M.l + band * i, y: M.t, width: band, height: plotH, fill: 'transparent', tabindex: d.runs ? 0 : -1,
      onpointermove: (e) => { lift(i); tipShow(e, fmtDay(d.date), opts.tipRows(d)); },
      onpointerleave: () => { unlift(); tipHide(); },
      onfocus: (e) => { const r = e.target.getBoundingClientRect(); lift(i); tipShow({ clientX: r.x + r.width / 2, clientY: r.y + 30 }, fmtDay(d.date), opts.tipRows(d)); },
      onblur: () => { unlift(); tipHide(); },
    });
    svg.append(hit);
  });
  function lift(i) { unlift(); const p = svg.querySelector(`[data-col="${i}"]`); if (p) p.setAttribute('opacity', '0.75'); }
  function unlift() { svg.querySelectorAll('[data-col]').forEach(p => p.removeAttribute('opacity')); }
  container.append(svg);
}

/* ------------------------------------------- chart: findings by severity */
function renderSevCard(tasks) {
  const byDay = groupByDay(tasks);
  const days = dayRange(tasks).map(date => {
    const g = byDay.get(dayKey(date));
    const sums = Object.fromEntries(SEVERITIES.map(k => [k, 0]));
    if (g) for (const t of g.tasks) {
      const f = t.review && t.review.findings_total;
      if (f) for (const k of SEVERITIES) sums[k] += f[k] || 0;
    }
    return { date, sums, total: SEVERITIES.reduce((a, k) => a + sums[k], 0) };
  });
  const legend = SEVERITIES.map(k => ({ label: k, color: cssVar(SEV_VAR[k]) }));
  renderCard(document.getElementById('card-sev'), {
    id: 'sev', title: 'Review findings by severity per day',
    legend,
    note: 'Darker = more severe. Counts are per-task totals across all review cycles.',
    table: {
      cols: [{ label: 'Date' }, ...SEVERITIES.map(k => ({ label: k, num: true })), { label: 'Total', num: true }],
      rows: days.filter(d => d.total > 0).map(d => [fmtDay(d.date), ...SEVERITIES.map(k => String(d.sums[k])), String(d.total)]),
    },
    renderChart: (el) => stackedColumns(el, days, legend),
  });
}

function stackedColumns(container, days, legend) {
  if (!days.length) { container.append(h('div', { class: 'empty' }, 'No data in this range.')); return; }
  const W = Math.max(320, container.clientWidth || 560);
  const M = { t: 14, r: 8, b: 26, l: 36 };
  const plotW = W - M.l - M.r, plotH = 176;
  const HGT = plotH + M.t + M.b;
  const maxV = Math.max(...days.map(d => d.total), 1);
  const ticks = niceTicks(maxV, 4);
  const yMax = ticks[ticks.length - 1];
  const y = v => M.t + plotH - (v / yMax) * plotH;
  const band = plotW / days.length;
  const barW = Math.min(24, Math.max(2, band - 3));
  const svg = s('svg', { width: W, height: HGT, viewBox: `0 0 ${W} ${HGT}`, role: 'img' });
  for (const tv of ticks) {
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(tv), y2: y(tv), stroke: cssVar('--grid'), 'stroke-width': 1 }));
    svg.append(s('text', { x: M.l - 7, y: y(tv) + 4, 'text-anchor': 'end', 'font-size': 11, fill: cssVar('--text-muted'), style: 'font-variant-numeric: tabular-nums' }, fmtInt(tv)));
  }
  svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(0), y2: y(0), stroke: cssVar('--baseline'), 'stroke-width': 1 }));
  const every = Math.max(1, Math.ceil(days.length / 8));
  days.forEach((d, i) => {
    const cx = M.l + band * i + band / 2;
    if (i % every === 0) svg.append(s('text', { x: cx, y: HGT - 8, 'text-anchor': 'middle', 'font-size': 11, fill: cssVar('--text-muted') }, fmtDay(d.date)));
    // stack most-severe at the baseline, working upward; 2px surface gaps between segments
    let acc = 0;
    const segs = SEVERITIES.map((k, si) => ({ k, v: d.sums[k], color: legend[si].color })).filter(x => x.v > 0);
    segs.forEach((seg, si) => {
      const y1 = y(acc);            // bottom of segment
      acc += seg.v;
      const y0 = y(acc);            // top of segment
      const isBottom = si === 0, isTop = si === segs.length - 1;
      const top = y0 + (isTop ? 0 : 1);
      const bottom = y1 - (isBottom ? 0 : 1);
      const hgt = Math.max(0.5, bottom - top);
      if (isTop) svg.append(s('path', { d: roundedTopRect(cx - barW / 2, top, barW, hgt, 3), fill: seg.color, 'data-col': i }));
      else svg.append(s('rect', { x: cx - barW / 2, y: top, width: barW, height: hgt, fill: seg.color, 'data-col': i }));
    });
    const rows = () => SEVERITIES.map((k, si) => ({ color: legend[si].color, value: String(d.sums[k]), label: k }))
      .concat([{ value: String(d.total), label: 'total' }]);
    svg.append(s('rect', {
      x: M.l + band * i, y: M.t, width: band, height: plotH, fill: 'transparent', tabindex: d.total ? 0 : -1,
      onpointermove: (e) => { lift(i); tipShow(e, fmtDay(d.date), rows()); },
      onpointerleave: () => { unlift(); tipHide(); },
      onfocus: (e) => { const r = e.target.getBoundingClientRect(); lift(i); tipShow({ clientX: r.x + r.width / 2, clientY: r.y + 30 }, fmtDay(d.date), rows()); },
      onblur: () => { unlift(); tipHide(); },
    }));
  });
  function lift(i) { unlift(); svg.querySelectorAll(`[data-col="${i}"]`).forEach(p => p.setAttribute('opacity', '0.8')); }
  function unlift() { svg.querySelectorAll('[data-col]').forEach(p => p.removeAttribute('opacity')); }
  container.append(svg);
}

/* --------------------------------------------------- chart: phase medians */
function renderPhasesCard(tasks) {
  const perPhase = PHASE_ORDER.map(name => {
    const durs = [], estShares = [];
    for (const t of tasks) {
      if (!Array.isArray(t.phases)) continue;
      const p = t.phases.find(x => x.phase === name);
      if (p && p.duration_sec != null) durs.push(p.duration_sec);
      const totalEst = t.phases.reduce((a, x) => a + (x.est_cost_usd || 0), 0);
      if (p && totalEst > 0) estShares.push((p.est_cost_usd || 0) / totalEst);
    }
    return {
      name,
      median: median(durs),
      total: durs.reduce((a, b) => a + b, 0),
      share: estShares.length ? estShares.reduce((a, b) => a + b, 0) / estShares.length : 0,
      color: cssVar(PHASE_VAR[name]),
    };
  });
  const shareSum = perPhase.reduce((a, p) => a + p.share, 0) || 1;
  perPhase.forEach(p => p.share = p.share / shareSum);

  renderCard(document.getElementById('card-phases'), {
    id: 'phases', title: 'Where the time goes (median per phase)',
    note: 'Bottom bar: average share of estimated cost per phase — estimates show proportions only; all $ totals elsewhere use billed cost.',
    table: {
      cols: [{ label: 'Phase' }, { label: 'Median time', num: true }, { label: 'Total time', num: true }, { label: 'Avg est-cost share', num: true }],
      rows: perPhase.map(p => [p.name, fmtDur(p.median), fmtDur(p.total), (p.share * 100).toFixed(1) + '%']),
    },
    renderChart: (el) => {
      hBarChart(el, perPhase.map(p => ({ label: p.name, value: p.median || 0 })), { color: cssVar('--series-1'), fmtValue: fmtDur });
      shareBar(el, perPhase);
    },
  });
}

function hBarChart(container, items, opts) {
  if (!items.length) { container.append(h('div', { class: 'empty' }, 'No data in this range.')); return; }
  const W = Math.max(320, container.clientWidth || 560);
  const M = { t: 4, r: 56, b: 4, l: 86 };
  const rowH = 26, barH = 16;
  const HGT = M.t + items.length * rowH + M.b;
  const plotW = W - M.l - M.r;
  const maxV = Math.max(...items.map(i => i.value), 0.001);
  const svg = s('svg', { width: W, height: HGT, viewBox: `0 0 ${W} ${HGT}`, role: 'img' });
  svg.append(s('line', { x1: M.l, x2: M.l, y1: M.t, y2: HGT - M.b, stroke: cssVar('--baseline'), 'stroke-width': 1 }));
  items.forEach((it, i) => {
    const cy = M.t + rowH * i + rowH / 2;
    const w = Math.max(1, (it.value / maxV) * plotW);
    svg.append(s('text', { x: M.l - 8, y: cy + 4, 'text-anchor': 'end', 'font-size': 12, fill: cssVar('--text-secondary') }, it.label));
    svg.append(s('path', { d: roundedRightRect(M.l, cy - barH / 2, w, barH, 4), fill: opts.color, 'data-row': i }));
    svg.append(s('text', { x: M.l + w + 7, y: cy + 4, 'font-size': 11.5, fill: cssVar('--text-secondary'), style: 'font-variant-numeric: tabular-nums' }, opts.fmtValue(it.value)));
    svg.append(s('rect', {
      x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent', tabindex: 0,
      onpointermove: (e) => tipShow(e, it.label, [{ color: opts.color, value: opts.fmtValue(it.value), label: 'median' }]),
      onpointerleave: tipHide,
      onfocus: (e) => { const r = e.target.getBoundingClientRect(); tipShow({ clientX: r.x + 120, clientY: r.y + 10 }, it.label, [{ color: opts.color, value: opts.fmtValue(it.value), label: 'median' }]); },
      onblur: tipHide,
    }));
  });
  container.append(svg);
}

function shareBar(container, perPhase) {
  const W = Math.max(320, container.clientWidth || 560);
  const barH = 20, HGT = barH + 30;
  const svg = s('svg', { width: W, height: HGT, viewBox: `0 0 ${W} ${HGT}`, role: 'img' });
  svg.append(s('text', { x: 0, y: 12, 'font-size': 11.5, fill: cssVar('--text-muted') }, 'Avg est-cost share by phase'));
  let x = 0;
  const segs = perPhase.filter(p => p.share > 0.002);
  segs.forEach((p, i) => {
    const w = Math.max(1, p.share * W - (i < segs.length - 1 ? 2 : 0));
    const y0 = 18;
    svg.append(s('rect', {
      x, y: y0, width: w, height: barH, fill: p.color, rx: 2, tabindex: 0,
      onpointermove: (e) => tipShow(e, p.name, [{ color: p.color, value: (p.share * 100).toFixed(1) + '%', label: 'of estimated cost' }]),
      onpointerleave: tipHide,
      onfocus: (e) => { const r = e.target.getBoundingClientRect(); tipShow({ clientX: r.x + r.width / 2, clientY: r.y + 24 }, p.name, [{ color: p.color, value: (p.share * 100).toFixed(1) + '%', label: 'of estimated cost' }]); },
      onblur: tipHide,
    }));
    const pctText = Math.round(p.share * 100) + '%';
    if (w > pctText.length * 7 + 10) {
      svg.append(s('text', { x: x + w / 2, y: y0 + 14, 'text-anchor': 'middle', 'font-size': 11, fill: inkFor(p.color) }, pctText));
    }
    x += w + 2;
  });
  container.append(svg);
}

/* ------------------------------------------ chart: cycle-1 findings trend */
function renderTrendCard(tasks) {
  const pts = tasks
    .map(t => {
      const c1 = Array.isArray(t.review_cycles) ? t.review_cycles.find(c => c.review_cycle === 1) : null;
      return c1 && c1.findings ? { date: t.date, issue: t.issue, v: c1.findings.total || 0 } : null;
    })
    .filter(Boolean);
  const WINDOW = 5;
  pts.forEach((p, i) => {
    const from = Math.max(0, i - WINDOW + 1);
    const slice = pts.slice(from, i + 1);
    p.roll = slice.reduce((a, q) => a + q.v, 0) / slice.length;
  });
  const raw = cssVar('--deemph'), acc = cssVar('--series-1');
  renderCard(document.getElementById('card-trend'), {
    id: 'trend', title: 'Findings in review cycle 1 per run',
    legend: [
      { label: 'per run', color: raw, type: 'line' },
      { label: `rolling avg (${WINDOW} runs)`, color: acc, type: 'line' },
    ],
    note: 'Falling trend = the review KB is paying off: fewer findings surface on the first review pass.',
    table: {
      cols: [{ label: 'Issue' }, { label: 'Date' }, { label: 'Cycle-1 findings', num: true }, { label: 'Rolling avg', num: true }],
      rows: pts.map(p => ['#' + p.issue, fmtDay(p.date), String(p.v), p.roll.toFixed(1)]),
    },
    renderChart: (el) => lineChart(el, pts, { raw, acc }),
  });
}

function lineChart(container, pts, colors) {
  if (pts.length < 2) { container.append(h('div', { class: 'empty' }, 'Not enough runs in this range.')); return; }
  const W = Math.max(320, container.clientWidth || 560);
  const M = { t: 14, r: 12, b: 26, l: 34 };
  const plotW = W - M.l - M.r, plotH = 190;
  const HGT = plotH + M.t + M.b;
  const maxV = Math.max(...pts.map(p => p.v), 1);
  const ticks = niceTicks(maxV, 4);
  const yMax = ticks[ticks.length - 1];
  const x = i => M.l + (pts.length === 1 ? plotW / 2 : (i / (pts.length - 1)) * plotW);
  const y = v => M.t + plotH - (v / yMax) * plotH;
  const svg = s('svg', { width: W, height: HGT, viewBox: `0 0 ${W} ${HGT}`, role: 'img', tabindex: 0, style: 'outline:none' });
  for (const tv of ticks) {
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(tv), y2: y(tv), stroke: cssVar('--grid'), 'stroke-width': 1 }));
    svg.append(s('text', { x: M.l - 7, y: y(tv) + 4, 'text-anchor': 'end', 'font-size': 11, fill: cssVar('--text-muted'), style: 'font-variant-numeric: tabular-nums' }, fmtInt(tv)));
  }
  svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(0), y2: y(0), stroke: cssVar('--baseline'), 'stroke-width': 1 }));
  const every = Math.max(1, Math.ceil(pts.length / 7));
  pts.forEach((p, i) => {
    if (i % every === 0) svg.append(s('text', { x: x(i), y: HGT - 8, 'text-anchor': 'middle', 'font-size': 11, fill: cssVar('--text-muted') }, fmtDay(p.date)));
  });
  const path = series => 'M' + pts.map((p, i) => `${x(i).toFixed(1)},${y(series(p)).toFixed(1)}`).join(' L');
  svg.append(s('path', { d: path(p => p.v), fill: 'none', stroke: colors.raw, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  svg.append(s('path', { d: path(p => p.roll), fill: 'none', stroke: colors.acc, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  // end marker + direct label on the emphasis series
  const last = pts[pts.length - 1];
  svg.append(s('circle', { cx: x(pts.length - 1), cy: y(last.roll), r: 4.5, fill: colors.acc, stroke: cssVar('--surface-1'), 'stroke-width': 2 }));
  svg.append(s('text', { x: x(pts.length - 1) - 8, y: y(last.roll) - 9, 'text-anchor': 'end', 'font-size': 11.5, fill: cssVar('--text-secondary'), style: 'font-variant-numeric: tabular-nums' }, last.roll.toFixed(1)));

  const hair = s('line', { y1: M.t, y2: M.t + plotH, stroke: cssVar('--baseline'), 'stroke-width': 1, visibility: 'hidden' });
  const dotR = s('circle', { r: 4.5, fill: colors.raw, stroke: cssVar('--surface-1'), 'stroke-width': 2, visibility: 'hidden' });
  const dotA = s('circle', { r: 4.5, fill: colors.acc, stroke: cssVar('--surface-1'), 'stroke-width': 2, visibility: 'hidden' });
  svg.append(hair, dotR, dotA);
  let focusIdx = null;
  function showAt(i, evt) {
    const p = pts[i];
    hair.setAttribute('x1', x(i)); hair.setAttribute('x2', x(i)); hair.setAttribute('visibility', 'visible');
    dotR.setAttribute('cx', x(i)); dotR.setAttribute('cy', y(p.v)); dotR.setAttribute('visibility', 'visible');
    dotA.setAttribute('cx', x(i)); dotA.setAttribute('cy', y(p.roll)); dotA.setAttribute('visibility', 'visible');
    tipShow(evt, `#${p.issue} · ${fmtDay(p.date)}`, [
      { color: colors.raw, value: String(p.v), label: 'cycle-1 findings' },
      { color: colors.acc, value: p.roll.toFixed(1), label: 'rolling avg' },
    ]);
  }
  function hideMarkers() {
    hair.setAttribute('visibility', 'hidden'); dotR.setAttribute('visibility', 'hidden'); dotA.setAttribute('visibility', 'hidden');
    tipHide();
  }
  svg.append(s('rect', {
    x: M.l, y: M.t, width: plotW, height: plotH, fill: 'transparent',
    onpointermove: (e) => {
      const rect = svg.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(((px - M.l) / plotW) * (pts.length - 1))));
      showAt(i, e);
    },
    onpointerleave: hideMarkers,
  }));
  svg.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    focusIdx = focusIdx == null ? pts.length - 1 : Math.max(0, Math.min(pts.length - 1, focusIdx + (e.key === 'ArrowRight' ? 1 : -1)));
    const rect = svg.getBoundingClientRect();
    showAt(focusIdx, { clientX: rect.left + x(focusIdx), clientY: rect.top + 40 });
  });
  svg.addEventListener('blur', () => { focusIdx = null; hideMarkers(); });
  container.append(svg);
}

/* ------------------------------------------------------------------ KPIs */
function renderKpis(tasks) {
  const ok = tasks.filter(t => t.outcome === 'ok');
  const incomplete = tasks.filter(t => t.outcome === 'incomplete').length;
  const failed = tasks.filter(t => t.outcome === 'failed').length;
  const cost = tasks.reduce((a, t) => a + (t.billed_cost_usd || 0), 0);
  const wall = tasks.reduce((a, t) => a + (t.total_sec || 0), 0);
  const medCost = median(ok.map(t => t.billed_cost_usd).filter(v => v != null));
  let findings = 0;
  for (const t of tasks) {
    const f = t.review && t.review.findings_total;
    if (f) findings += SEVERITIES.reduce((a, k) => a + (f[k] || 0), 0);
  }
  const tiles = [
    { label: 'Runs', value: String(tasks.length), sub: `${ok.length} ok · ${incomplete} incomplete · ${failed} failed` },
    { label: 'Success rate', value: tasks.length ? Math.round((ok.length / tasks.length) * 100) + '%' : '—', sub: 'ok / all runs' },
    { label: 'Billed cost', value: fmtUsd(cost), sub: 'sum of billed_cost_usd' },
    { label: 'Wall time', value: fmtDur(wall), sub: 'sum across runs' },
    { label: 'Median cost / ok run', value: fmtUsd(medCost), sub: ok.length + ' ok runs' },
    { label: 'Review findings', value: fmtInt(findings), sub: 'caught across all cycles' },
  ];
  const el = document.getElementById('kpis');
  el.textContent = '';
  for (const t of tiles) {
    el.append(h('div', { class: 'tile' },
      h('div', { class: 'label' }, t.label),
      h('div', { class: 'value' }, t.value),
      h('div', { class: 'sub' }, t.sub),
    ));
  }
}

/* ------------------------------------------------------------- runs table */
const RUN_COLS = [
  { key: '_chev', label: '', sortable: false },
  { key: 'issue', label: 'Issue', sortable: true },
  { key: 'ts', label: 'Date', sortable: true },
  { key: 'attempt', label: 'Att.', sortable: true, num: true },
  { key: 'outcome', label: 'Outcome', sortable: true },
  { key: 'model_ran', label: 'Model', sortable: true },
  { key: 'total_sec', label: 'Duration', sortable: true, num: true },
  { key: 'billed_cost_usd', label: 'Billed', sortable: true, num: true },
  { key: '_cycles', label: 'Cycles', sortable: true, num: true },
  { key: '_findings', label: 'Findings', sortable: false },
];
function runSortVal(t, key) {
  if (key === '_cycles') return t.review ? t.review.cycles_run : -1;
  if (key === 'ts') return t.date.getTime();
  const v = t[key];
  return v == null ? -Infinity : v;
}
function outcomeChip(outcome) {
  const map = {
    ok: { icon: '✓', color: 'var(--status-good)' },
    incomplete: { icon: '◐', color: 'var(--status-warning)' },
    failed: { icon: '✕', color: 'var(--status-critical)' },
  };
  const m = map[outcome] || { icon: '?', color: 'var(--text-muted)' };
  const dot = h('span', { class: 'dot' }, m.icon);
  dot.style.color = m.color;
  return h('span', { class: 'status' }, dot, outcome);
}
function findingsCell(t) {
  const f = t.review && t.review.findings_total;
  if (!f) return '—';
  const parts = [];
  for (const [k, abbr] of [['critical', 'C'], ['high', 'H'], ['medium', 'M'], ['low', 'L'], ['style', 'S']]) {
    if (f[k]) parts.push(f[k] + abbr);
  }
  return parts.length ? h('span', { class: 'sevtag' }, parts.join(' ')) : h('span', { class: 'sevtag' }, '0');
}
function shortModel(m) {
  return m ? m.replace(/^claude-/, '') : '—';
}
function runKey(t) { return t.issue + '|' + t.ts; }

function renderRuns(tasks) {
  const card = document.getElementById('card-runs');
  card.textContent = '';
  const sorted = [...tasks].sort((a, b) => {
    const av = runSortVal(a, state.sort.key), bv = runSortVal(b, state.sort.key);
    return (av < bv ? -1 : av > bv ? 1 : 0) * state.sort.dir;
  });
  const thead = h('thead', null, h('tr', null, RUN_COLS.map(c => {
    const th = h('th', {
      class: (c.num ? 'num ' : '') + (c.sortable ? 'sortable' : ''),
      ...(c.sortable ? { onclick: () => {
        if (state.sort.key === c.key) state.sort.dir *= -1;
        else state.sort = { key: c.key, dir: c.key === 'ts' ? -1 : 1 };
        renderAll();
      } } : {}),
    }, c.label + (state.sort.key === c.key ? (state.sort.dir === 1 ? ' ▲' : ' ▼') : ''));
    return th;
  })));
  const tbody = h('tbody');
  for (const t of sorted) {
    const key = runKey(t);
    const open = state.expanded.has(key);
    const row = h('tr', {
      class: 'expandable',
      onclick: () => { open ? state.expanded.delete(key) : state.expanded.add(key); renderAll(); },
    },
      h('td', null, h('span', { class: 'chev' + (open ? ' open' : '') }, '›')),
      h('td', null, h('a', { href: REPO_ISSUES + t.issue, target: '_blank', rel: 'noopener', onclick: (e) => e.stopPropagation() }, '#' + t.issue)),
      h('td', null, fmtDateTime(t.date)),
      h('td', { class: 'num' }, String(t.attempt ?? 1)),
      h('td', null, outcomeChip(t.outcome)),
      h('td', null, shortModel(t.model_ran)),
      h('td', { class: 'num' }, fmtDur(t.total_sec)),
      h('td', { class: 'num' }, fmtUsd(t.billed_cost_usd)),
      h('td', { class: 'num' }, t.review ? String(t.review.cycles_run) : '—'),
      h('td', null, findingsCell(t)),
    );
    tbody.append(row);
    if (open) tbody.append(h('tr', { class: 'detail-row' }, h('td', { colspan: String(RUN_COLS.length) }, runDetail(t))));
  }
  if (!sorted.length) card.append(h('div', { class: 'empty' }, 'No runs in this range.'));
  else card.append(h('div', { style: 'overflow-x:auto' }, h('table', { class: 'data' }, thead, tbody)));
}

function runDetail(t) {
  const detail = h('div', { class: 'detail' });
  if (Array.isArray(t.phases) && t.phases.length) {
    detail.append(h('h3', null, 'Time by phase'));
    detail.append(phaseStackBar(t.phases, t.total_sec));
    const lg = h('div', { class: 'legend', style: 'margin-top:6px' });
    for (const name of PHASE_ORDER) {
      if (!t.phases.some(p => p.phase === name)) continue;
      const sw = h('span', { class: 'sw' });
      sw.style.background = cssVar(PHASE_VAR[name]);
      lg.append(h('span', { class: 'item' }, sw, name));
    }
    detail.append(lg);
    detail.append(h('h3', null, 'Phases'));
    detail.append(dataTable(
      [{ label: 'Phase' }, { label: 'Time', num: true }, { label: 'Turns', num: true }, { label: 'Tool calls', num: true }, { label: 'Peak ctx', num: true }, { label: 'Est. cost', num: true }],
      t.phases.map(p => [p.phase, fmtDur(p.duration_sec), fmtInt(p.turns ?? 0), fmtInt(p.tool_calls ?? 0), fmtCtx(p.peak_ctx_tokens), fmtUsd(p.est_cost_usd)]),
    ));
  }
  if (Array.isArray(t.review_cycles) && t.review_cycles.length) {
    detail.append(h('h3', null, 'Review cycles'));
    detail.append(dataTable(
      [{ label: 'Cycle', num: true }, { label: 'Blockers', num: true }, { label: 'C', num: true }, { label: 'H', num: true }, { label: 'M', num: true }, { label: 'L', num: true }, { label: 'S', num: true }, { label: 'Review', num: true }, { label: 'Fix', num: true }, { label: 'Est. cost', num: true }],
      t.review_cycles.map(c => [
        String(c.review_cycle), String(c.findings?.blocker ?? 0),
        String(c.findings?.critical ?? 0), String(c.findings?.high ?? 0), String(c.findings?.medium ?? 0),
        String(c.findings?.low ?? 0), String(c.findings?.style ?? 0),
        fmtDur(c.review_sec), fmtDur(c.fix_sec), fmtUsd(c.est_cost_usd),
      ]),
    ));
  }
  detail.append(h('div', { class: 'footnote' },
    `Billed total ${fmtUsd(t.billed_cost_usd)} · asked for ${t.model_asked ?? '—'}, ran ${t.model_ran ?? '—'} · phase costs are estimates`));
  return detail;
}

function phaseStackBar(phases, totalSec) {
  const W = 720, barH = 20;
  const total = phases.reduce((a, p) => a + (p.duration_sec || 0), 0) || 1;
  const svg = s('svg', { width: '100%', height: barH, viewBox: `0 0 ${W} ${barH}`, preserveAspectRatio: 'none', role: 'img', style: 'max-width:720px' });
  let x = 0;
  const ordered = PHASE_ORDER.map(n => phases.find(p => p.phase === n)).filter(Boolean).filter(p => (p.duration_sec || 0) > 0);
  ordered.forEach((p, i) => {
    const w = Math.max(1, (p.duration_sec / total) * W - (i < ordered.length - 1 ? 2 : 0));
    svg.append(s('rect', {
      x, y: 0, width: w, height: barH, fill: cssVar(PHASE_VAR[p.phase]), rx: 2, tabindex: 0,
      onpointermove: (e) => tipShow(e, p.phase, [
        { color: cssVar(PHASE_VAR[p.phase]), value: fmtDur(p.duration_sec), label: ((p.duration_sec / total) * 100).toFixed(0) + '% of run' },
      ]),
      onpointerleave: tipHide,
      onfocus: (e) => { const r = e.target.getBoundingClientRect(); tipShow({ clientX: r.x + r.width / 2, clientY: r.y + 24 }, p.phase, [{ color: cssVar(PHASE_VAR[p.phase]), value: fmtDur(p.duration_sec), label: ((p.duration_sec / total) * 100).toFixed(0) + '% of run' }]); },
      onblur: tipHide,
    }));
    x += w + 2;
  });
  return svg;
}

/* ------------------------------------------------------------------ epics */
function renderEpics(epics) {
  const card = document.getElementById('card-epics');
  card.textContent = '';
  card.append(h('div', { class: 'card-head' }, h('h2', null, 'Epics')));
  if (!epics.length) { card.append(h('div', { class: 'empty' }, 'No epic runs in this range.')); return; }
  card.append(dataTable(
    [{ label: 'Epic' }, { label: 'Branch' }, { label: 'Children', num: true }, { label: 'Wall', num: true }, { label: 'Billed', num: true }],
    epics.map(e => [
      h('a', { href: REPO_ISSUES + e.epic, target: '_blank', rel: 'noopener' }, '#' + e.epic),
      h('span', { style: 'word-break:break-all' }, e.branch || '—'),
      `${e.child_ok}/${e.child_total}`,
      fmtDur(e.wall_sec),
      fmtUsd(e.billed_cost_usd) + (e.billed_partial ? ' †' : ''),
    ]),
  ));
  if (epics.some(e => e.billed_partial)) card.append(h('div', { class: 'footnote' }, '† partial billing data'));
}

/* ---------------------------------------------------------------- lessons */
function renderLessons(lessons) {
  const card = document.getElementById('card-lessons');
  card.textContent = '';
  card.append(h('div', { class: 'card-head' }, h('h2', null, 'Review lessons (KB)')));
  if (!lessons.length) { card.append(h('div', { class: 'empty' }, 'No lessons recorded.')); return; }
  const sorted = [...lessons].sort((a, b) => (b.occurrences || 0) - (a.occurrences || 0));
  const maxOcc = Math.max(...sorted.map(l => l.occurrences || 0), 1);
  card.append(dataTable(
    [{ label: 'Lesson' }, { label: 'Category' }, { label: 'Status' }, { label: 'Occurrences', num: true }],
    sorted.map(l => {
      const bar = h('span', { class: 'mini-bar' });
      bar.style.width = Math.max(4, ((l.occurrences || 0) / maxOcc) * 70) + 'px';
      return [
        h('span', { title: l.rule || '' }, l.title || l.id),
        l.category || '—',
        l.status || '—',
        h('span', null, bar, ' ', String(l.occurrences ?? 0)),
      ];
    }),
  ));
  card.append(h('div', { class: 'footnote' }, 'Cumulative registry — not affected by the period filter. Hover a lesson for its full rule.'));
}

/* ---------------------------------------------------------------- filters */
function renderSeg(el, options, current, onPick) {
  el.textContent = '';
  for (const opt of options) {
    el.append(h('button', { class: current === opt.value ? 'on' : '', onclick: () => onPick(opt.value) }, opt.label));
  }
}

/* ------------------------------------------------------------- render all */
function renderAll() {
  if (!state.data) return;
  renderSeg(document.getElementById('seg-period'),
    [{ value: 'all', label: 'All time' }, { value: '90', label: '90d' }, { value: '30', label: '30d' }, { value: '7', label: '7d' }],
    state.period, v => { state.period = v; renderAll(); });
  renderSeg(document.getElementById('seg-outcome'),
    [{ value: 'all', label: 'All' }, { value: 'ok', label: 'ok' }, { value: 'problems', label: 'incomplete + failed' }],
    state.outcome, v => { state.outcome = v; renderAll(); });

  const tasks = filteredTasks();
  renderKpis(tasks);
  renderCostCard(tasks);
  renderTrendCard(tasks);
  renderPhasesCard(tasks);
  renderSevCard(tasks);
  renderRuns(tasks);
  renderEpics(filteredEpics());
  renderLessons(state.data.lessons);

  const f = state.data.files;
  const newest = [f.tasks.mtime, f.reviewCycles.mtime, f.epics.mtime, f.lessons.mtime].filter(Boolean).sort().pop();
  document.getElementById('asof').textContent =
    `${state.data.tasks.length} runs · data updated ${newest ? fmtDateTime(new Date(newest)) : '—'}`;
}

/* ----------------------------------------------------------------- fetch */
let lastSignature = '';
async function load(manual) {
  const main = document.getElementById('main');
  main.classList.add('loading');
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const sig = JSON.stringify(data.files);
    if (manual || sig !== lastSignature || !state.data) {
      lastSignature = sig;
      state.data = data;
      renderAll();
    }
  } catch (err) {
    document.getElementById('asof').textContent = 'Failed to load data: ' + err.message;
  } finally {
    main.classList.remove('loading');
  }
}
document.getElementById('refresh').addEventListener('click', () => load(true));
setInterval(() => load(false), 30000);

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderAll, 150);
});
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
}
load(true);
</script>
